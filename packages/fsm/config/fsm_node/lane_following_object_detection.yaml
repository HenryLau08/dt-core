# FSM for lane_following_object_detection
# Adds OBJECT_DETECTED (wait/stop) and AVOIDING (active avoidance manoeuvre)
# on top of the standard lane_following FSM.

initial_state: "NORMAL_JOYSTICK_CONTROL"

events:
  joystick_override_on:
    topic: "joy_mapper_node/joystick_override"
    msg_type: "BoolStamped"
    trigger: True

  joystick_override_off:
    topic: "joy_mapper_node/joystick_override"
    msg_type: "BoolStamped"
    trigger: False

  object_detected:
    topic: "object_detection_node/object_detected"
    msg_type: "BoolStamped"
    trigger: True

  object_cleared:
    topic: "object_detection_node/object_detected"
    msg_type: "BoolStamped"
    trigger: False

  avoidance_done:
    topic: "object_detection_node/avoidance_done"
    msg_type: "BoolStamped"
    trigger: True

nodes:
  anti_instagram:         "anti_instagram_node/switch"
  line_detector_node:     "line_detector_node/switch"
  lane_filter_node:       "lane_filter_node/switch"
  ground_projection_node: "ground_projection_node/switch"
  lane_controller_node:   "lane_controller_node/switch"
  led_emitter_node:       "led_emitter_node/switch"
  object_detection_node:  "object_detection_node/switch"

global_transitions:
  joystick_override_on:  "NORMAL_JOYSTICK_CONTROL"
  joystick_override_off: "LANE_FOLLOWING"

states:
  NORMAL_JOYSTICK_CONTROL:
    active_nodes:
      - anti_instagram
      - lane_filter_node
      - line_detector_node
      - ground_projection_node
      - led_emitter_node
      - object_detection_node
    lights: "GREEN"

  LANE_FOLLOWING:
    active_nodes:
      - anti_instagram
      - line_detector_node
      - lane_filter_node
      - ground_projection_node
      - lane_controller_node
      - led_emitter_node
      - object_detection_node
    lights: "CAR_DRIVING"
    transitions:
      object_detected: "OBJECT_DETECTED"

  OBJECT_DETECTED:
    # lane_controller_node is OFF → wheels stop being commanded → bot stops.
    # object_detection_node stays ON: it counts patience and triggers avoidance.
    # When patience expires, the node publishes object_detected=False (clearing
    # this state) and directly drives the wheels for the avoidance manoeuvre.
    active_nodes:
      - anti_instagram
      - line_detector_node
      - lane_filter_node
      - ground_projection_node
      - led_emitter_node
      - object_detection_node
    lights: "OBSTACLE_ALERT"
    transitions:
      object_cleared:  "LANE_FOLLOWING"   # duckie walked away on its own
      avoidance_done:  "LANE_FOLLOWING"   # avoidance manoeuvre completed

  AVOIDING:
    # During avoidance the object_detection_node drives the wheels directly
    # via ~wheels_cmd (remapped to wheels_driver_node/wheels_cmd in master.launch).
    # lane_controller_node is OFF so it doesn't interfere.
    # This state is entered implicitly: when the node publishes object_detected=False
    # from OBJECT_DETECTED the FSM returns to LANE_FOLLOWING, but the node is
    # simultaneously publishing wheel commands for the manoeuvre. LANE_FOLLOWING
    # has lane_controller OFF until the mode propagates, which gives the node
    # exclusive wheel control for the duration of the manoeuvre.
    # avoidance_done brings us cleanly back.
    active_nodes:
      - anti_instagram
      - line_detector_node
      - lane_filter_node
      - ground_projection_node
      - led_emitter_node
      - object_detection_node
    lights: "CAR_DRIVING"
    transitions:
      avoidance_done: "LANE_FOLLOWING"
